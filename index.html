<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="무작위 로또 번호 6개를 추첨합니다." />
    <title>로또 번호 추첨기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="/" aria-label="로또 번호 추첨기 처음으로">
          <span class="brand-mark">L</span>
          <span>LOTTO PICK</span>
        </a>
        <button id="themeToggle" class="icon-button" type="button" title="다크 모드로 전환" aria-label="다크 모드로 전환">&#9790;</button>
      </header>

      <section class="picker-card" aria-labelledby="pageTitle">
        <p class="eyebrow">RANDOM NUMBER GENERATOR</p>
        <h1 id="pageTitle">오늘의 행운 번호</h1>
        <p class="intro">1부터 45까지, 중복 없이 여섯 개의 번호를 뽑아드립니다.</p>

        <div id="balls" class="balls-container" aria-live="polite" aria-label="추첨된 로또 번호">
          <p class="placeholder">버튼을 눌러 번호를 추첨해 보세요.</p>
        </div>
        <button id="generateBtn" class="generate-button" type="button">번호 추첨하기</button>
      </section>

      <section class="history-section" aria-labelledby="historyTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">RECENT PICKS</p>
            <h2 id="historyTitle">최근 추첨 번호</h2>
          </div>
          <button id="clearHistoryBtn" class="text-button" type="button" hidden>기록 지우기</button>
        </div>
        <ol id="historyList" class="history-list" aria-live="polite"></ol>
        <p id="emptyHistory" class="empty-history">아직 추첨 기록이 없습니다.</p>
      </section>

      <section class="contact-section" aria-labelledby="contactTitle">
        <div class="section-heading contact-heading">
          <div>
            <p class="eyebrow">PARTNERSHIP</p>
            <h2 id="contactTitle">제휴 문의</h2>
          </div>
          <p class="contact-note">영업일 기준 1~2일 내 회신드립니다.</p>
        </div>
        <form id="contactForm" class="contact-form" action="https://formspree.io/f/mbgjzrbj" method="POST">
          <input type="hidden" name="_subject" value="[LOTTO PICK] 새로운 제휴 문의" />
          <label class="visually-hidden" for="company">회사명</label>
          <input id="company" name="company" type="text" placeholder="회사명 또는 담당자명" required />
          <label class="visually-hidden" for="email">이메일</label>
          <input id="email" name="email" type="email" placeholder="회신 받을 이메일" required />
          <label class="visually-hidden" for="message">문의 내용</label>
          <textarea id="message" name="message" rows="5" placeholder="제휴 내용과 연락처를 남겨주세요." required></textarea>
          <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <button id="contactSubmit" class="contact-submit" type="submit">문의 보내기</button>
          <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="comments-section" aria-labelledby="commentsTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">COMMUNITY</p>
            <h2 id="commentsTitle">댓글</h2>
          </div>
        </div>
        <div id="disqus_thread"></div>
        <noscript>
          댓글을 보려면 JavaScript를 활성화해 주세요.
          <a href="https://disqus.com/?ref_noscript">Disqus 댓글</a>
        </noscript>
      </section>
    </main>
    <script>
      (function () {
        const d = document;
        const s = d.createElement("script");
        s.src = "https://productbuilder-0bfi3o6ttu.disqus.com/embed.js";
        s.setAttribute("data-timestamp", String(+new Date()));
        (d.head || d.body).appendChild(s);
      })();
    </script>
    <script src="script.js"></script>
  </body>
</html>
